{% extends "base.html" %}
{% block title %}Log In | Sumbong{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0">Log In to Sumbong</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary-custom w-100 mt-2">Log In</button>
                </form>
                <p class="mt-3 mb-0 text-center">
                    Need an account? <a href="{% url 'signup' %}">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
