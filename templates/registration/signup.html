{% extends "base.html" %}
{% block title %}Register | Sumbong{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h4 class="mb-0 text-dark">Account Registration</h4>
                <small class="text-muted">Fill in your details to create an account</small>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary-custom w-100 mt-2">Create Account</button>
                </form>
                <p class="mt-3 mb-0 text-center">
                    Already have an account? <a href="{% url 'login' %}">Log in here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
